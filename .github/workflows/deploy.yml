name: 検証して GitHub Pages へ公開する

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "content/**"
      - "tools/**"
      - ".github/workflows/deploy.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: 依存関係を入れる
        run: npm ci --prefix app

      - name: データを検証してビルドする
        run: npm run check --prefix app

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: app/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
